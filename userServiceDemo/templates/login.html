<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Login</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger alert-dismissible fade {{show_error}}"
                         role="alert" style="display:{{show_error_display}}">
                        {{error}}
                        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
                    </div>

                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" required type="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" required type="password">
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Login</button>
                    </form>
                    <div class="mt-3 text-center">
                        <small class="text-muted">
                            Demo: Use <strong>admin@system.com</strong> / <strong>admin</strong>
                        </small>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="mb-3">
                        <label class="form-label" for="email">Register</label>
                        <input class="form-control" id="register_btn" name="register" onclick="window.location.href = '/register';" type="button"
                               value="Sign up">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
