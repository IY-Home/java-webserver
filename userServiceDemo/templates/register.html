<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">User Registration</h3>
                </div>
                <div class="card-body">
                    <form action="/register" enctype="multipart/form-data" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="name">Full Name *</label>
                            <input class="form-control" id="name" name="name" required type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address *</label>
                            <input class="form-control" id="email" name="email" required type="email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone">Phone Number *</label>
                            <input class="form-control" id="phone" name="phone" required type="tel">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password *</label>
                            <input class="form-control" id="password" minlength="6" name="password" required
                                   type="password">
                            <div class="form-text">Minimum 6 characters</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="avatar">Profile Picture</label>
                            <input accept="image/*" class="form-control" id="avatar" name="avatar" type="file">
                            <div class="form-text">Supported: PNG, JPG, JPEG, GIF</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="admin">Admin User </label>
                            <input class="form-check-input" id="admin" name="admin" type="checkbox">
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Register</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a class="text-decoration-none" href="/admin">View all registered users →</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
